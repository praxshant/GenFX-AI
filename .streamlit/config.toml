[theme]
base = "dark"
primaryColor = "#E8D5B7"
backgroundColor = "#0F0F0F"
secondaryBackgroundColor = "#161616"
textColor = "#F0EDE8"
font = "monospace"

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Tracebacks name files, paths and settings; a public deployment should not
# show them to visitors. Pipeline diagnostics are still shown in the app.
showErrorDetails = false
